services:
  web:
    image: ${IMAGE}
    restart: unless-stopped
    stop_grace_period: 1m
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?задайте DJANGO_SECRET_KEY в .env}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?укажите хост приложения}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?укажите публичный https-домен}
      DB_PATH: /app/data/db.sqlite3
      MEDIA_ROOT: /app/media
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-200}
    volumes:
      - media_data:/app/media
      - db_data:/app/data
      - static_data:/app/staticfiles
    command: ["gunicorn", "config.wsgi:application",
     "--bind", "0.0.0.0:8000",
     "--workers", "2",
     "--threads", "2",
     "--timeout", "120",
     "--graceful-timeout", "30",
     "--access-logfile", "-",
     "--error-logfile", "-",
     "--worker-tmp-dir", "/dev/shm"]
    networks:
      - bookclub

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media/:ro
      - static_data:/app/staticfiles/:ro
    networks:
      - bookclub

volumes:
  media_data:
  db_data:
  static_data:

networks:
  bookclub:
    driver: bridge
