upstream django_app {
    server web:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name _;

    # Видео и аудио книги бывают крупными. Без этого nginx обрывает
    # запрос на дефолтных 1 МБ и админ не сможет залить файл.
    # Значение должно быть не меньше, чем MAX_UPLOAD_SIZE_MB в settings.
    client_max_body_size 200M;
    client_body_timeout 300s;

    # Медиа отдаём напрямую с диска, минуя Python. Именно поэтому
    # /media/ больше не нужно монтировать в приложение через DEBUG.
    location /media/ {
        alias /app/media/;
        # nginx сам обрабатывает Range-запросы, поэтому mp4 перематывается
        # без скачивания целиком.
        add_header Accept-Ranges bytes;
        autoindex off;
        # Файлы неизменяемы: имя приходит из FileField и не переиспользуется.
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location /static/ {
        alias /app/staticfiles/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Служебные файлы не должны уезжать наружу даже при ошибке маршрутизации.
    location ~ /\. { deny all; return 404; }
    location ~* \.(sqlite3|sqlite3-wal|sqlite3-shm|env|pyc)$ { deny all; return 404; }

    location = /favicon.ico { access_log off; log_not_found off; return 204; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Запросы к приложению. X-Forwarded-* нужны Django: без них он не
    # поймёт, что снаружи https, и secure-cookie не отправятся,
    # а CSRF-проверка Origin отклонит любой POST.
    location / {
        proxy_pass http://django_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $http_x_forwarded_port;

        # Загрузка файла идёт долго: дефолтные 60 секунд рвут соединение.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;

        # Ответ приложения не буферизуем целиком — иначе файл пользователю
        # начнёт приходить только после загрузки целиком на диск.
        proxy_request_buffering off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json
        application/xml image/svg+xml;

    # Заголовки безопасности. HSTS намеренно не выставляем: TLS
    # терминирует Nginx Proxy Manager на другом сервере, и его домен
    # мы не знаем — HSTS с неверным именем «залипнет» в браузерах.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
}
